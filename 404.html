    <title>Pagina niet gevonden | AI-vaardigheid Hub</title>
    <script>
        // GitHub Pages toont deze pagina ook bij diepere adressen (bijv. /AI-Vaardigheid-en-KIES/oud/pagina).
        // Met een base-tag laden de stijlen, afbeeldingen en links dan toch vanaf de hoofdmap van de site.
        if (location.hostname.endsWith('github.io')) {
            const base = document.createElement('base');
            base.href = '/' + location.pathname.split('/')[1] + '/';
            document.head.appendChild(base);
        }
    </script>
